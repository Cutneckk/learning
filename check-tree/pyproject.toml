[project]
name = "check-tree"
version = "0.1.0"
description = ""
authors = [
    {name = "Cutneckk",email = "cutneckk@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "typer (>=0.24.1,<0.25.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "check_tree", from = "src"},
    {include = "tree.py"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.2,<0.16.0)",
    "black (>=26.1.0,<27.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "pathlib (>=1.0.1,<2.0.0)"
]
